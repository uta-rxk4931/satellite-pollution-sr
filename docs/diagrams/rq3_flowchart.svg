<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="910" viewBox="0 0 1160 910" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1160" height="910" fill="#ffffff"/>

  <!-- arrows (drawn first, under the boxes) -->
  <g stroke="#6b6a65" stroke-width="1.6" fill="none">
    <line x1="320" y1="60" x2="418" y2="60"/>
    <line x1="550" y1="90" x2="400" y2="148"/>
    <line x1="550" y1="90" x2="700" y2="148"/>
    <line x1="380" y1="210" x2="480" y2="268"/>
    <line x1="720" y1="210" x2="620" y2="268"/>
    <line x1="480" y1="330" x2="300" y2="378"/>
    <line x1="620" y1="330" x2="850" y2="378"/>
    <line x1="290" y1="420" x2="290" y2="438"/>
    <line x1="290" y1="510" x2="290" y2="528"/>
    <line x1="290" y1="600" x2="290" y2="618"/>
    <line x1="860" y1="420" x2="860" y2="438"/>
    <line x1="860" y1="500" x2="860" y2="518"/>
    <line x1="860" y1="590" x2="860" y2="608"/>
    <line x1="860" y1="680" x2="860" y2="698"/>
    <line x1="290" y1="690" x2="440" y2="808"/>
    <line x1="860" y1="770" x2="720" y2="808"/>
  </g>
  <line x1="908" y1="180" x2="852" y2="180" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>

  <polygon points="418.0,60.0 408.0,55.0 408.0,65.0" fill="#6b6a65"/>
  <polygon points="400.0,148.0 411.1,149.1 407.5,139.7" fill="#6b6a65"/>
  <polygon points="700.0,148.0 692.5,139.7 688.9,149.1" fill="#6b6a65"/>
  <polygon points="480.0,268.0 473.9,258.7 468.8,267.3" fill="#6b6a65"/>
  <polygon points="620.0,268.0 631.2,267.3 626.1,258.7" fill="#6b6a65"/>
  <polygon points="300.0,378.0 311.0,380.3 308.4,370.6" fill="#6b6a65"/>
  <polygon points="850.0,378.0 841.2,371.1 839.2,380.9" fill="#6b6a65"/>
  <polygon points="290.0,438.0 295.0,428.0 285.0,428.0" fill="#6b6a65"/>
  <polygon points="290.0,528.0 295.0,518.0 285.0,518.0" fill="#6b6a65"/>
  <polygon points="290.0,618.0 295.0,608.0 285.0,608.0" fill="#6b6a65"/>
  <polygon points="860.0,438.0 865.0,428.0 855.0,428.0" fill="#6b6a65"/>
  <polygon points="860.0,518.0 865.0,508.0 855.0,508.0" fill="#6b6a65"/>
  <polygon points="860.0,608.0 865.0,598.0 855.0,598.0" fill="#6b6a65"/>
  <polygon points="860.0,698.0 865.0,688.0 855.0,688.0" fill="#6b6a65"/>
  <polygon points="440.0,808.0 435.2,797.9 429.0,805.7" fill="#6b6a65"/>
  <polygon points="720.0,808.0 731.0,810.2 728.3,800.6" fill="#6b6a65"/>
  <polygon points="852.0,180.0 862.0,185.0 862.0,175.0" fill="#b8860b"/>

  <!-- step 1: the model makes two maps -->
  <rect x="60" y="30" width="260" height="60" rx="8" fill="#f1efe8" stroke="#8a887f"/>
  <text x="190" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1d">Blurry 4 km AOD patch</text>
  <text x="190" y="76" text-anchor="middle" font-size="12.5" fill="#52514e">input, 16 × 16 pixels</text>

  <rect x="420" y="30" width="260" height="60" rx="8" fill="#eeedfe" stroke="#7f77dd"/>
  <text x="550" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1d">SR model</text>
  <text x="550" y="76" text-anchor="middle" font-size="12.5" fill="#52514e">EDSR / U-Net / SwinIR-light</text>

  <rect x="250" y="150" width="260" height="60" rx="8" fill="#e1f5ee" stroke="#1d9e75"/>
  <text x="380" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1d">Prediction ŷ</text>
  <text x="380" y="196" text-anchor="middle" font-size="12.5" fill="#52514e">sharp 1 km AOD map (64 × 64)</text>

  <rect x="590" y="150" width="260" height="60" rx="8" fill="#dbe9fb" stroke="#2a78d6" stroke-width="2.2"/>
  <text x="720" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1f1f1d">Uncertainty σ̂</text>
  <text x="720" y="196" text-anchor="middle" font-size="12.5" fill="#52514e">one number per pixel: "I might be off by…"</text>

  <!-- how sigma is learned -->
  <rect x="910" y="110" width="220" height="150" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-dasharray="6 4"/>
  <text x="1020" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1f1d">How σ̂ is learned</text>
  <text x="1020" y="152" text-anchor="middle" font-size="12" fill="#52514e">(training, 2018–2021)</text>
  <text x="1020" y="178" text-anchor="middle" font-size="12.5" fill="#1f1f1d">loss = (y − ŷ)²/σ̂² + log σ̂²</text>
  <text x="1020" y="202" text-anchor="middle" font-size="12" fill="#52514e">too sure → 1st term punishes</text>
  <text x="1020" y="220" text-anchor="middle" font-size="12" fill="#52514e">too unsure → 2nd term punishes</text>
  <text x="1020" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1d">→ σ̂² ≈ its usual squared error</text>

  <!-- step 2: compare with the truth -->
  <rect x="330" y="270" width="440" height="60" rx="8" fill="#faece7" stroke="#d85a30"/>
  <text x="550" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1d">Compare with the true 1 km map y</text>
  <text x="550" y="316" text-anchor="middle" font-size="12.5" fill="#52514e">2023 test year only: never used for training or choosing anything</text>

  <!-- RQ3(a) column -->
  <rect x="60" y="380" width="460" height="40" rx="8" fill="#2a78d6"/>
  <text x="290" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">RQ3(a): does σ̂ point at the hard pixels?</text>

  <rect x="60" y="440" width="460" height="70" rx="8" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="290" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">Group pixels by σ̂ → real error of each group</text>
  <text x="290" y="490" text-anchor="middle" font-size="12.5" fill="#52514e">error rises 5–7× from "most sure" to "least sure", σ̂ rises with it ✓</text>

  <rect x="60" y="530" width="460" height="70" rx="8" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="290" y="556" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">16 positions inside each 4 × 4 block</text>
  <text x="290" y="580" text-anchor="middle" font-size="12.5" fill="#52514e">corners harder than centres; σ̂ vs error rank corr 0.99 ✓</text>

  <rect x="60" y="620" width="460" height="70" rx="8" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="290" y="646" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">Is σ̂ the right size? (90% range = ŷ ± 1.645σ̂)</text>
  <text x="290" y="670" text-anchor="middle" font-size="12.5" fill="#52514e">EDSR 91% inside ✓   ·   U-Net 83%, SwinIR 79%: σ̂ too small</text>

  <!-- RQ3(b) column -->
  <rect x="630" y="380" width="460" height="40" rx="8" fill="#1baf7a"/>
  <text x="860" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">RQ3(b): a guaranteed 90% range</text>

  <rect x="630" y="440" width="460" height="60" rx="8" fill="#e9f7f1" stroke="#1baf7a"/>
  <text x="860" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">Range for every pixel = ŷ ± λ · σ̂</text>
  <text x="860" y="486" text-anchor="middle" font-size="12.5" fill="#52514e">stretch σ̂ by one number λ</text>

  <rect x="630" y="520" width="460" height="70" rx="8" fill="#e9f7f1" stroke="#1baf7a"/>
  <text x="860" y="546" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">2022: smallest λ with misses + safety margin ≤ 10%</text>
  <text x="860" y="570" text-anchor="middle" font-size="12.5" fill="#52514e">λ̂ = 1.75 (EDSR) … 2.58 (SwinIR + rule)   ·   raw would be 1.645</text>

  <rect x="630" y="610" width="460" height="70" rx="8" fill="#e9f7f1" stroke="#1baf7a"/>
  <text x="860" y="636" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">Check on 2023: at most 10% outside?</text>
  <text x="860" y="660" text-anchor="middle" font-size="12.5" fill="#52514e">6.5–7.2% outside for all 6 models ✓   (SwinIR raw was 20.9%)</text>

  <rect x="630" y="700" width="460" height="70" rx="8" fill="#e9f7f1" stroke="#1baf7a"/>
  <text x="860" y="726" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1d">vs a constant range ŷ ± c (ignores σ̂)</text>
  <text x="860" y="750" text-anchor="middle" font-size="12.5" fill="#52514e">cloud edges &amp; hazy days: 8–13% missed vs 17–20% ✓</text>

  <!-- answer -->
  <rect x="200" y="810" width="760" height="76" rx="10" fill="#1f1f1d"/>
  <text x="580" y="840" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">σ̂ is real uncertainty: it follows the real error, and puts the range width where it's needed</text>
  <text x="580" y="866" text-anchor="middle" font-size="13" fill="#d9d8d3">→ after one factor fitted on 2022, every model's range contains ≥ 90% of 2023 pixels (with 90% confidence)</text>
</svg>
